name: verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q adultcam
      - name: Verify FFmpeg availability and local RTMP receipt
        run: |
          ffmpeg -version | head -n 1
          python -m adultcam.rtmp_probe --self-test --port 0 --duration 2 --timeout 20
      - name: Verify real localhost RTMPS TLS and received video frames
        run: python -m adultcam.rtmps_probe
      - name: Verify controlled owned-receiver receipts and privacy gate
        run: python -m pytest -q tests/test_070_delivery.py tests/test_070_privacy.py tests/test_070_obs_privacy_gate.py tests/test_070_monitor_privacy.py tests/test_070_real_receipt.py
      - name: Verify synthetic local multistream
        run: python -m adultcam.simulcast_lab --receivers 2 --duration 3
      - name: Verify mobile console JavaScript syntax
        run: node --check adultcam/web/console.js
      - name: Verify 0.9 official read-only API and fail-closed RGB24 video
        run: python -m pytest -q tests/test_090_official_platform.py tests/test_090_platform_api.py tests/test_090_privacy_pipeline.py tests/test_090_privacy_transport.py
      - name: Verify owner-statistics API contract offline
        run: python -m pytest -q tests/test_090_chaturbate_stats.py tests/test_090_chaturbate_api.py
      - name: Verify production release stays locked without independent evidence
        run: |
          python -m pytest -q tests/test_100_gate_basics.py tests/test_100_gate_signed.py
          python -c "import subprocess,sys; p=subprocess.run([sys.executable,'-m','adultcam.release_gate'],capture_output=True,text=True); assert p.returncode==2 and '\"approved\": false' in p.stdout, p.stdout"
      - name: Validate offline-only account slots and blocked streaming
        run: |
          python -m pytest -q tests/test_100_standalone_onboarding.py
          python -m compileall -q adultcam
          node --check adultcam/web/console.js
