name: verify
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q adultcam
      - name: Verify FFmpeg availability and local RTMP receipt
        run: |
          ffmpeg -version | head -n 1
          python -m adultcam.rtmp_probe --self-test --port 0 --duration 2 --timeout 20
      - name: Verify real localhost RTMPS TLS and received video frames
        run: python -m adultcam.rtmps_probe
      - name: Verify controlled owned-receiver receipts and privacy gate
        run: python -m pytest -q tests/test_070_delivery.py tests/test_070_privacy.py tests/test_070_obs_privacy_gate.py tests/test_070_monitor_privacy.py tests/test_070_real_receipt.py
